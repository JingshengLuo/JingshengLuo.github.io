---
layout: default
---

{% include base_path %}

<div class="wrap{% if page.width == 'wide' %} wrap--wide{% endif %}">

  {% if page.title and page.hide_title != true %}
    <header class="page-header--centred">
      <h1 class="page-title">{{ page.title }}</h1>
      {% if page.lede %}<p class="page-lede">{{ page.lede }}</p>{% endif %}
    </header>
  {% endif %}

  {% if page.prose == false %}
    {{ content }}
  {% else %}
    <div class="prose">{{ content }}</div>
  {% endif %}

</div>
