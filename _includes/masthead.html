{% include base_path %}

<header class="site-header">
  <div class="site-header__inner">

    <a class="site-header__brand" href="{{ base_path }}/">{{ site.title }}</a>

    <nav class="site-nav" aria-label="Primary">
      {% for link in site.data.navigation.main %}
        {% if link.url contains 'http' %}
          {% assign href = link.url %}
        {% else %}
          {% assign href = link.url | prepend: base_path %}
        {% endif %}
        <a href="{{ href }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
      {% endfor %}

      <button class="theme-toggle" type="button"
              aria-label="Toggle colour theme" title="Toggle colour theme">
        <i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i>
      </button>
    </nav>

  </div>
</header>

<script>
  (function () {
    var btn = document.querySelector('.theme-toggle');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var root = document.documentElement;
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    });
  })();
</script>
