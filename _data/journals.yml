# Journals where the work has appeared.
#
# `logo:` is optional. When present the mark is hotlinked from the publisher
# (or Wikimedia Commons) and rendered as an image card; if that URL ever 404s
# or the publisher adds referrer blocking, the card degrades to the wordmark
# automatically — see the onerror handler in _includes/footer/custom.html.
#
# To use a self-hosted mark instead, drop the file into images/ and
# point `logo:` at it, e.g.  logo: /images/adma.png
#
# `weight` drives size in the wall: 3 = largest. Roughly tracks paper count.

